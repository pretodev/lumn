version: "2"
sql:
  - engine: "sqlite"
    schema:
      - "./migrations"
    queries:
      - "./queries"
    gen:
      go:
        package: "sqlc"
        out: "../internal/store/sqlc"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_interface: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "decimal"
            go_type: "float64"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "datetime"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "datetime"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
